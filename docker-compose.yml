services:
  dicom-batch:
    build: .
    image: dicom-batch-processor:latest
    container_name: dicom-batch-processor
    ports:
      - "8000:8000"
    environment:
      # 生产部署必须替换为机构合法的 DICOM UID 组织前缀（<=30 字符）
      DICOM_UID_PREFIX: "1.2.826.0.1.3680043.10.9999"
      DICOM_DATA_DIR: "/data"
      MAX_CONTENT_LENGTH: "2147483648"
      SQLITE_BUSY_TIMEOUT_MS: "30000"
      FLASK_SECRET_KEY: "change-this-in-production"
      # 研究 PACS（C-STORE 接收方）
      PACS_HOST: "research-pacs"
      PACS_PORT: "11112"
      PACS_AE_TITLE: "RESEARCH_PACS"
      PACS_CALLING_AE_TITLE: "DICOM_BATCH"
      PACS_CONNECT_TIMEOUT: "10"
      PACS_DIMSE_TIMEOUT: "30"
    volumes:
      - dicom_data:/data
    depends_on:
      - research-pacs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  # 本机研究 PACS 模拟端：DICOM Storage SCP，接收 C-STORE 并按 SOPInstanceUID 落盘
  research-pacs:
    build: .
    image: dicom-batch-processor:latest
    container_name: research-pacs-scp
    command: ["python", "-m", "app.scp_server"]
    ports:
      - "11112:11112"
    environment:
      SCP_AE_TITLE: "RESEARCH_PACS"
      SCP_PORT: "11112"
      SCP_STORAGE_DIR: "/scp_data"
      # 设为 0xA700 可模拟 PACS 拒收，用于验证“拒收”状态流转
      SCP_RESPONSE_STATUS: "0x0000"
    volumes:
      - scp_data:/scp_data
    restart: unless-stopped

volumes:
  dicom_data:
  scp_data:
